[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-wells"
version = "0.1.0"
description = "Reusable Pump It Up modeling and inference pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "xgboost>=2.0", "joblib>=1.3", "matplotlib>=3.7", "geopandas>=1.2", "rasterio>=1.3"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.66,<2"]
dev = ["pytest>=7", "jupyterlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
